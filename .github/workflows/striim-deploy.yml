name: Deploy Striim TQL

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      branch:
        description: 'Git branch to checkout and deploy from'
        required: false
        default: ''
      environment:
        description: 'GitHub Environment to deploy to'
        required: false
        default: ''
      drop_applications:
        description: 'Comma-separated list of applications to drop before deployment'
        required: false
        default: ''
      force_drop_all:
        description: 'Drop all changed applications before deployment'
        type: boolean
        required: false
        default: false

jobs:
  resolve:
    runs-on:
      - self-hosted
      - label-7

    outputs:
      environment: ${{ steps.resolve_env.outputs.environment }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch != '' && github.event.inputs.branch || github.ref_name }}

      - name: Ensure Python is available.
        shell: bash
        run: |
          python3 --version

      - name: Verify Python and pip.
        shell: bash
        run: |
          python3 --version
          if python3 -m pip --version; then
            echo "pip is available"
          else
            echo "pip is not available. Attempting to install python3-pip."
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y python3-pip
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y python3-pip
            else
              echo "Unable to install pip automatically on this runner"
              exit 1
            fi
          fi

      - name: Upgrade pip
        shell: bash
        run: python3 -m pip install --upgrade pip

      - name: Install dependencies
        shell: bash
        run: python3 -m pip install -r .github/scripts/requirements.txt

      - name: Resolve deployment environment
        id: resolve_env
        shell: bash
        run: |
          branch="${{ github.event.inputs.branch }}"
          if [ -z "$branch" ]; then
            branch="${{ github.ref_name }}"
          fi
          override="${{ github.event.inputs.environment }}"

          args=(
            ".github/scripts/resolve_environment.py"
            "--config"
            ".github/striim-deploy-settings.yml"
            "--branch"
            "$branch"
          )

          if [ -n "$override" ]; then
            args+=("--environment" "$override")
          fi

          envName=$(python3 "${args[@]}")
          echo "Resolved deployment environment: $envName"
          echo "environment=$envName" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    runs-on:
      - self-hosted
      - label-7
    environment: ${{ needs.resolve.outputs.environment }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch != '' && github.event.inputs.branch || github.ref_name }}

      - name: Ensure Python is available.
        shell: bash
        run: |
          python3 --version

      - name: Install dependencies
        shell: bash
        run: python3 -m pip install -r .github/scripts/requirements.txt

      - name: Identify Changed Files
        id: identify_changes
        shell: bash
        run: python3 .github/scripts/detect_changes.py

      - name: Show Changed TQL Files
        if: steps.identify_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          echo "Changed TQL files detected:"
          files="${{ steps.identify_changes.outputs.changed_files }}"
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              echo "- $line"
            fi
          done <<< "$files"

      - name: Deploy Changed TQL Files
        if: steps.identify_changes.outputs.has_changes == 'true'
        continue-on-error: true
        shell: bash
        run: |
          python3 .github/scripts/deploy_striim.py \
            --config ".github/striim-deploy-settings.yml" \
            --files "${{ steps.identify_changes.outputs.changed_files }}" \
            --branch "${{ github.event.inputs.branch != '' && github.event.inputs.branch || github.ref_name }}" \
            ${{ github.event.inputs.drop_applications != '' && format('--drop-applications "{0}"', github.event.inputs.drop_applications) || '' }} \
            ${{ github.event.inputs.force_drop_all == 'true' && '--force-drop-all' || '' }}
        env:
          STRIIM_BASE_URL: ${{ secrets.STRIIM_BASE_URL }}
          STRIIM_USERNAME: ${{ secrets.STRIIM_USERNAME }}
          STRIIM_PASSWORD: ${{ secrets.STRIIM_PASSWORD }}
          

      - name: No TQL changes found.
        if: steps.identify_changes.outputs.has_changes != 'true'
        shell: powershell
        run: Write-Host "No changed TQL file found. Deployment not required."